{% extends 'base.html' %}

{% block head %}
<title> Doctors Rating</title>
{% endblock %}

{% block body %}
<div class = "content">
    <h1> Doctors rating main page</h1>
    <div>
        <form action="/login" method="post">
            <input type = "submit" value = "login" id = "btn_login" />
        </form>

        <form action="/register" method="post">
            <input type = "submit" value = "register" id = "btn_register" />
        </form>        
    </div>
    <div>

        <table name="doctors_table">
            <tr>
                <th> Name </th>
                <th> Specialization </th>
                <th> Overall Rating </th>
                <th> Felling </th>
                <th> Professionalism </th>
                <th> Price </th>
                <th> Time Wait</th>
            </tr>

            {% for doctor in doctors %}
            <tr>
                <td> {{doctor['name']}} </td>
                <td> {{doctor['specialization']}}</td>
            </tr>
            {% endfor %}

        </table>
    </div>
</div>

{% endblock %}
